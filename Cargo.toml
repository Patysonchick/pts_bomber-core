[package]
name = "pts_bomber-core"
version = "0.1.0"
authors = ["Эдгар Томский <edgarkozlov3229@gmail.com>"]
edition = "2021"
description = "pts_bomber in one library."
readme = "README.md"
homepage = "https://github.com/Patysonchick/pts_bomber-core"
repository = "https://github.com/Patysonchick/pts_bomber-core.git"
license = "MIT"
license-file = "LICENSE"
keywords = ["bomber", "sms", "call", "services"]
categories = ["network-programming"]

[dependencies]
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3.31"
serde_json = "1.0.138"
